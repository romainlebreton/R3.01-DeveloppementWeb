201" y="840.851" fill="#000" font-size="15.6" textLength="343.933">is_null(ConnexionBaseDeDonnees::$instance) ?</text></g><path d="M758.535,825.374 L758.535,879.374 L1100.535,879.374 L1100.535,837.374 L1088.535,825.374 L758.535,825.374" style="stroke:#181818;stroke-width:0.6;" fill="#FEFFDD"/><path d="M1088.535,825.374 L1088.535,837.374 L1100.535,837.374 L1088.535,825.374" style="stroke:#181818;stroke-width:0.6;" fill="#FEFFDD"/><text x="765.735" y="848.051" fill="#000" font-size="15.6" textLength="317.757">false : pas de nouvel appel au constructeur,</text><text x="765.735" y="869.298" fill="#000" font-size="15.6" textLength="195.031">pas de nouvelle connexion</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg14" data-source-line="32"><polygon points="94.727,909.516,82.727,914.316,94.727,919.116,89.927,914.316" fill="#181818" style="stroke:#181818;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="87.527" y1="914.316" x2="378.601" y2="914.316" style="stroke:#181818;stroke-width:1.2;stroke-dasharray:2.4,2.4;"/><text x="101.927" y="907.345" fill="#000" font-size="15.6" textLength="268.617">$instance->pdo (le même objet PDO)</text></g><path d="M17.296,929.916 L17.296,1005.516 L1196.896,1005.516 L1196.896,941.916 L1184.896,929.916 L17.296,929.916" style="stroke:#181818;stroke-width:0.6;" fill="#FEFFDD"/><path d="M1184.896,929.916 L1184.896,941.916 L1196.896,941.916 L1184.896,929.916" style="stroke:#181818;stroke-width:0.6;" fill="#FEFFDD"/><text x="256.615" y="952.592" fill="#000" font-size="15.6" textLength="690.176">Le constructeur étant privé, « new ConnexionBaseDeDonnees() » est interdit hors de la classe :</text><text x="256.615" y="973.839" fill="#000" font-size="15.6" textLength="616.372">on est obligé de passer par getPdo(). L'instance vit le temps de l'exécution du script :</text><text x="256.615" y="995.087" fill="#000" font-size="15.6" textLength="624.328">une nouvelle requête HTTP recrée une nouvelle instance 