174,371.5,657.174" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="145" x="371.5" y="638.365">echo $_SESSION["login"]</text><polygon fill="#A80036" points="59.5,684.88,49.5,688.88,59.5,692.88,55.5,688.88" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53.5" x2="358.5" y1="688.88" y2="688.88"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="169" x="65.5" y="683.071">&lt;html&gt;... rlebreton ...&lt;/html&gt;</text><!--MD5=[b0ac9fb0a8068880ab47f6ce797606c1]
@startuml
title Sessions : le cookie ne contient que l'identifiant
skinparam sequenceMessageAlign left
actor "Navigateur" as C
participant "Serveur PHP" as S
database "Fichiers de session\n(/tmp)" as F

== Première visite ==
C -> S : GET controleurFrontal.php?action=ecrireSession
activate S
S -> S : session_start()\n(pas de PHPSESSID reçu)
S -> F : crée sess_aapot
S -> S : $_SESSION["login"] = "rlebreton"
S -> F : fin du script : écrit login|s:9:"rlebreton";
S - -> C : Set-Cookie: PHPSESSID=aapot
deactivate S

== Visites suivantes ==
C -> S : GET controleurFrontal.php?action=lireSession\nCookie: PHPSESSID=aapot
activate S
S -> S : session_start()
S -> F : lit sess_aapot
activate F
F - -> S : login = "rlebreton"
deactivate F
S -> S : echo $_SESSION["login"]
S - -> C : <html>... rlebreton ...</html>
deactivate S
@enduml

