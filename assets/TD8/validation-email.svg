21 L880,739.2921 L880,704.2921 L870,694.2921 L686,694.2921 " fill="#FBFB77" filter="url(#f13girs943r6we)" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M870,694.2921 L870,704.2921 L880,704.2921 L870,694.2921 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="163" x="692" y="713.1891">true : seul le propriétaire de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="173" x="692" y="730.8951">la boîte mail connaît le nonce</text><polygon fill="#A80036" points="814.5,768.4101,824.5,772.4101,814.5,776.4101,818.5,772.4101" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="527.5" x2="820.5" y1="772.4101" y2="772.4101"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="165" x="534.5" y="766.6011">UPDATE de l'utilisateur toto</text><path d="M831,785.4101 L831,848.4101 L1022,848.4101 L1022,795.4101 L1012,785.4101 L831,785.4101 " fill="#FBFB77" filter="url(#f13girs943r6we)" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M1012,785.4101 L1012,795.4101 L1022,795.4101 L1012,785.4101 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="170" x="837" y="804.3071">email = "toto@yopmail.com"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="128" x="837" y="822.0131">emailAValider = NULL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="84" x="837" y="839.7192">nonce = NULL</text><polygon fill="#A80036" points="59.5,894.9402,49.5,898.9402,59.5,902.9402,55.5,898.9402" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53.5" x2="521.5" y1="898.9402" y2="898.9402"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="42" x="65.5" y="875.4252">200 OK</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="193" x="65.5" y="893.1312">&lt;html&gt;... détail de toto ...&lt;/html&gt;</text><!--MD5=[c15b530de85a8cf9342aa71c1aacda42]
@startuml
title Validation d'une adresse email par nonce
skinparam sequenceMessageAlign left
actor "Navigateur" as C
participant "Serveur PHP" as S
database "Table utilisateur\n(BDD)" as B
participant "Boîte mail de\ntoto@yopmail.com" as M

== Création de l'utilisateur ==
C -> S : POST controleurFrontal.php?action=creerDepuisFormulaire\nlogin=toto, email=toto@yopmail.com, ...
activate S
S -> S : nonce = MotDePasse::genererChaineAleatoire()
S -> B : INSERT de l'utilisateur toto
note right of B
  email = NULL
  emailAValider = "toto@yopmail.com"
  nonce = "a1b2c3"
end note
S -> M : VerificationEmail::envoiEmailValidation()\nlien : ...?action=validerEmail&login=toto&nonce=a1b2c3
S - -> C : 200 OK\n<html>...</html>
deactivate S

== Validation de l'email ==
C -> M : consulte ses mails
M - -> C : lien de validation
C -> S : GET controleurFrontal.php?action=validerEmail&login=toto&nonce=a1b2c3
activate S
S -> B : récupère l'utilisateur toto
activate B
B - -> S : nonce = "a1b2c3"
deactivate B
S -> S : "a1b2c3" === "a1b2c3" ?
note right : true : seul le propriétaire de\nla boîte mail connaît le nonce
S -> B : UPDATE de l'utilisateur toto
note right of B
  email = "toto@yopmail.com"
  emailAValider = NULL
  nonce = NULL
end note
S - -> C : 200 OK\n<html>... détail de toto ...</html>
deactivate S
@enduml

